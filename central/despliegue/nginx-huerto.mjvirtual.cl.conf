# nginx del servidor mjvirtual para el Huerto Inteligente.
#
#   sudo cp central/despliegue/nginx-huerto.mjvirtual.cl.conf /etc/nginx/sites-available/huerto.mjvirtual.cl
#   sudo ln -s /etc/nginx/sites-available/huerto.mjvirtual.cl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d huerto.mjvirtual.cl      # agrega el HTTPS y la redirección
#
# La app escucha SOLO en 127.0.0.1:18020 (WEB_ESCUCHA y WEB_PUERTO del .env).

server {
    listen 80;
    listen [::]:80;
    server_name huerto.mjvirtual.cl;

    # Una lectura del ESP32 pesa ~150 bytes; los formularios del tablero, poco más
    client_max_body_size 64k;

    # Tiempo real del tablero (Server-Sent Events): sin buffer y conexión larga
    location = /api/eventos {
        proxy_pass http://127.0.0.1:18020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # sobrescribe (no concatena): no falsificable
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:18020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # --- OPCIONAL: tablero con usuario y clave (la API del ESP32 queda libre,
    #     porque ya exige su token). Crear la clave con:
    #       sudo apt install apache2-utils
    #       sudo htpasswd -c /etc/nginx/huerto.htpasswd macarena
    #     y descomentar estas líneas:
    #
    # auth_basic "Huerto Inteligente";
    # auth_basic_user_file /etc/nginx/huerto.htpasswd;
    # location = /api/lecturas {
    #     auth_basic off;
    #     proxy_pass http://127.0.0.1:18020;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Host $host;
    # }
}
