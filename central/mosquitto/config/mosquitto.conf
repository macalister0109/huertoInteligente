# Mosquitto — broker MQTT del huerto (red local, sin internet)

# Escucha en la red del huerto. Sin TLS en esta iteración (red cerrada);
# la autenticación por usuario y la ACL evitan que un nodo escriba en otra cama.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistencia: los mensajes QoS 1 pendientes para el procesador
# (sesión persistente) sobreviven a un reinicio del broker.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Límite de mensajes en cola por cliente desconectado (~2 h de 10 camas a 30 s)
max_queued_messages 5000

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
