{# Menú principal: las páginas que existen hoy en el sistema. #}
{% macro menu_principal(activo='', clase='menu-principal') %}
<nav class="{{ clase }}" aria-label="Menú principal">
  <ul>
    <li><a href="{{ url_for('tablero.proyecto') }}" {% if activo == 'proyecto' %}aria-current="page"{% endif %}>Proyecto</a></li>
    <li><a href="{{ url_for('tablero.tablero') }}" {% if activo == 'tablero' %}aria-current="page"{% endif %}>Tablero en vivo</a></li>
    <li><a href="{{ url_for('tablero.tablero', kiosco=1) }}">Pantalla del huerto</a></li>
    <li><a href="{{ url_for('config.inicio') }}" {% if activo == 'configuracion' %}aria-current="page"{% endif %}>Configuración</a></li>
  </ul>
</nav>
{% endmacro %}
