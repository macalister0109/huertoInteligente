# Huerto Inteligente — equipo central (Raspberry Pi arm64, también corre en PC amd64)
#
#   cd central
#   cp .env.example .env               # y edita las claves
#   ./mosquitto/usuarios.sh servicios  # crea los usuarios MQTT
#   docker compose up -d
#
# Servicios: mosquitto (broker), mariadb (BD local), procesador (reglas y alertas)
# y web (inicio en http://IP_DE_LA_PI:8080, camas en /tablero, kiosco en
# http://localhost:8080/tablero?kiosco=1; la dirección antigua /?kiosco=1 también sirve).
#
# En el servidor (detrás de nginx) se publica solo en localhost, desde el .env:
#   WEB_ESCUCHA=127.0.0.1  WEB_PUERTO=18020  MQTT_ESCUCHA=127.0.0.1
# Ver docs/DESPLIEGUE_MJVIRTUAL.md

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mariadb
      MQTT_HOST: mosquitto
    ports:
      # En la casa: 0.0.0.0 (los ESP32 de la red local llegan directo).
      # En el servidor: 127.0.0.1 (solo nginx llega; afuera se entra por HTTPS).
      - "${WEB_ESCUCHA:-0.0.0.0}:${WEB_PUERTO:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  procesador:
    build:
      context: .
      dockerfile: procesador/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mariadb
      MQTT_HOST: mosquitto
      TZ: America/Santiago        # solo afecta la hora de los logs
    depends_on:
      mariadb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # no llenar la tarjeta SD de la Pi

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Los nodos actuales envían por HTTP: MQTT solo lo usan la web y el procesador
      # (por la red interna de Docker). En el servidor NO se expone a internet.
      - "${MQTT_ESCUCHA:-0.0.0.0}:${MQTT_PUERTO_LOCAL:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - datos_mosquitto:/mosquitto/data

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}  # MariaDB no arranca si queda vacía
      MARIADB_DATABASE: ${MARIADB_DATABASE:-huerto}
      MARIADB_USER: ${MARIADB_USER:-huerto}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      # Pensado para la RAM de una Raspberry Pi
      - --innodb-buffer-pool-size=128M
    volumes:
      - datos_mariadb:/var/lib/mysql
      # Se ejecutan solo la primera vez (volumen vacío), en orden alfabético
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/semillas.sql:/docker-entrypoint-initdb.d/02_semillas.sql:ro
    ports:
      # Solo accesible desde la misma Pi (herramientas de CQ y exportación)
      - "127.0.0.1:${DB_PUERTO_LOCAL:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40

  # BD desechable para pytest (datos en memoria). No necesita .env.
  #   docker compose --profile test up -d --wait mariadb_test
  mariadb_test:
    image: mariadb:11.4
    profiles: ["test"]
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_DATABASE: huerto_test
      MARIADB_USER: huerto
      MARIADB_PASSWORD: test
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/semillas.sql:/docker-entrypoint-initdb.d/02_semillas.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  datos_mosquitto:
  datos_mariadb:
